[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizza-firma-stampa"
version = "1.0.0"
description = "Programma per organizzare schede, firmare e stampare PDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywin32",
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "bandit",
    "deptry",
    "codespell",
    "refurb",
    "vulture",
    "xenon",
    "radon",
    "interrogate",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pyfakefs",
]

# === RUFF CONFIGURATION ===
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "T20",  # flake8-print
]
ignore = [
    "E501", # Line too long (managed by formatter)
    "E722", # Bare except (often used in this legacy-style COM code)
    "E701", # Multiple statements on one line (colon) - used heavily in UI/logic
    "E702", # Multiple statements on one line (semicolon) - used heavily in UI/logic
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# === MYPY CONFIGURATION ===
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = false # Lo teniamo a false inizialmente per non bloccare tutto
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = ["tests", ".venv", "build", "dist", "__pycache__"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "win32com.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pythoncom"
ignore_missing_imports = true

# === DEPTRY CONFIGURATION ===
[tool.deptry]
known_first_party = ["src"]
exclude = ["tests", ".venv", "__pycache__"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "ruff", "mypy", "bandit", "deptry", "codespell", "refurb", 
    "vulture", "xenon", "radon", "interrogate", "pre-commit", 
    "pytest", "pytest-cov", "pytest-mock", "pyfakefs"
]
DEP003 = ["src"]

# === BANDIT CONFIGURATION ===
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B110"] # Ignora assert e try-except-pass (molto comuni in interazione COM)

# === INTERROGATE CONFIGURATION ===
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
fail-under = 0
exclude = ["tests", ".venv"]
